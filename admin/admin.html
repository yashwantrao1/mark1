<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <main class="admin-layout">
        <aside>
            <div class="left">
                <button class="active" data-view-btn="home" type="button">Home</button>
                <button data-view-btn="section" type="button">Section</button>
                <button data-view-btn="edit" type="button">Content</button>
                <button data-view-btn="layers" type="button">Layers</button>
            </div>
            <div class="right">
                <div id="homePanel">
                    <div class="connectWithRoot" id="connectWithRoot">
                        <button id="connectRootBtn" class="cta" type="button">Connect Root</button>
                        <button id="disconnectRootBtn" class="cta danger hidden" type="button">Disconnect Root</button>
                    </div>
                    <div class="pathListing" id="pathListing">
                        <p>Connect root folder to manage routes.</p>
                    </div>
                    <div class="crud-grid mt-3">
                        <label>Body Background Color (default null)</label>
                        <input id="pageBodyBgInput" type="color" value="#ffffff" class="h-8 !p-1">
                        <label>Meta Title</label>
                        <input id="pageMetaTitleInput" type="text" class="text-sm" placeholder="Enter page title">
                        <label>Meta Description</label>
                        <textarea id="pageMetaDescriptionInput" rows="3" class="!bg-[#0b1220] border border-[#374151] p-1 !rounded-md text-sm" placeholder="Enter meta description"></textarea>
                    </div>
                </div>
                <div id="sectionPanel">
                    <div class="crud-grid">
                        <div class="crud-actions">
                            <button id="addSectionBtn" class="cta fill" type="button">Add Section</button>
                        </div>
                        <label class="flex items-center justify-between gap-3 border border-slate-700 rounded-lg px-3 py-2 bg-slate-950/60"
                            for="lockSectionMovementToggle">
                            <span class="text-slate-300 text-xs">Lock Selected Section Movement</span>
                            <span class="relative inline-flex h-6 w-11 items-center">
                                <input id="lockSectionMovementToggle" type="checkbox" class="peer sr-only">
                                <span
                                    class="h-6 w-11 rounded-full border border-slate-600 bg-slate-700 transition-colors peer-checked:bg-blue-600 peer-checked:border-blue-500 peer-disabled:opacity-50"></span>
                                <span
                                    class="pointer-events-none absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-slate-100 transition-transform peer-checked:translate-x-5"></span>
                            </span>
                        </label>
                        <div>
                            <label>Section Internal Grid (columns / rows)</label>
                            <div class="grid grid-cols-2 gap-2">
                                <input id="sectionInnerColsInput" type="number" min="1" value="12">
                                <input id="sectionInnerRowsInput" type="number" min="1" value="6">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <label>Padding (px)</label>
                            <input id="sectionPaddingInput" type="number" min="0" value="0">

                            <label>Border Radius (px)</label>
                            <input id="sectionRadiusInput" type="number" min="0" value="0">

                            <label>Background Color</label>
                            <input id="sectionBgColorInput" type="color" value="#dbeafe" class="h-8 !p-1">

                        </div>
                        <div class="crud-actions">
                            <button id="deleteSectionBtn" class="cta danger" type="button">Delete Selected
                                Section</button>
                        </div>
                    </div>
                </div>
                <div id="editPanel">
                    <div class="crud-grid">
                        <label>Add Elements</label>
                        <div class="crud-actions">
                            <button id="addBlockBtn" class="cta" type="button">Add Block</button>
                            <button id="addTextBtn" class="cta hidden" type="button">Add Text</button>
                            <button id="addImageBtn" class="cta hidden" type="button">Add Image</button>
                        </div>

                        <div id="blockStylePanel" class="crud-grid hidden">
                            <label>Block Style</label>
                            <div class="grid grid-cols-2 gap-2">
                                <label>Padding (px)</label>
                                <input id="blockPaddingInput" type="number" min="0" value="0">
                                <label>Border Radius (px)</label>
                                <input id="blockRadiusInput" type="number" min="0" value="0">
                                <label>Border Width (px)</label>
                                <input id="blockBorderWidthInput" type="number" min="0" value="0">
                                <label>Border Color</label>
                                <input id="blockBorderColorInput" type="color" value="#93c5fd" class="h-8 !p-1">
                                <label>Background</label>
                                <input id="blockBgColorInput" type="color" value="#dbeafe" class="h-8 !p-1">
                            </div>
                        </div>

                        <div id="blockContentPanel" class="crud-grid hidden">
                            <label>Add Content To Selected Block</label>
                            <div class="crud-actions">
                                <button id="addBlockImageBtn" class="cta" type="button">Image</button>
                                <button id="addBlockParagraphBtn" class="cta" type="button">Paragraph</button>
                                <button id="addBlockHeadingBtn" class="cta" type="button">Heading</button>
                                <button id="addBlockHtmlBtn" class="cta" type="button">HTML</button>
                                <button id="addBlockTableBtn" class="cta" type="button">Table</button>
                                <button id="addBlockListBtn" class="cta" type="button">List</button>
                            </div>
                        </div>

                        <div id="imageStylePanel" class="crud-grid hidden">
                            <label>Image Settings</label>
                            <div class="crud-actions">
                                <button id="imageFitCoverBtn" class="cta" type="button">Cover</button>
                                <button id="imageFitContainBtn" class="cta" type="button">Contain</button>
                            </div>
                            <label>Upload Image</label>
                            <div class="crud-actions">
                                <button id="uploadBlockImageBtn" class="cta" type="button">Upload</button>
                                <input id="uploadBlockImageInput" type="file" accept="image/*" class="hidden">
                            </div>
                            <label>Object Position</label>
                            <div class="crud-actions">
                                <button id="imagePosUpBtn" class="cta" type="button">↑</button>
                                <button id="imagePosLeftBtn" class="cta" type="button">←</button>
                                <button id="imagePosCenterBtn" class="cta" type="button">•</button>
                                <button id="imagePosRightBtn" class="cta" type="button">→</button>
                                <button id="imagePosDownBtn" class="cta" type="button">↓</button>
                            </div>
                        </div>

                        <div id="textStylePanel" class="crud-grid hidden">
                            <label>Text Settings</label>
                            <div class="crud-actions">
                                <button id="textBoldBtn" class="cta bold" type="button">B</button>
                                <button id="textItalicBtn" class="cta italic" type="button">I</button>
                                <button id="textUnderlineBtn" class="cta underline" type="button">U</button>
                                <div class="w-[2px] mx-2 h-full bg-white/20"></div>
                                <button id="textAlignLeftBtn" class="cta h-[34px] w-[34px] flex items-center justify-center relative p-0" type="button"><img class="h-[24px] w-[24px] invert opacity-80" src="/assets/left.svg" alt=""></button>
                                <button id="textAlignCenterBtn" class="cta h-[34px] w-[34px] flex items-center justify-center relative p-0" type="button"><img class="h-[24px] w-[24px] invert opacity-80" src="/assets/center.svg" alt=""></button>
                                <button id="textAlignRightBtn" class="cta h-[34px] w-[34px] flex items-center justify-center relative p-0" type="button"><img class="h-[24px] w-[24px] invert opacity-80" src="/assets/right.svg" alt=""></button>
                                <button id="textAlignJustifyBtn" class="cta h-[34px] w-[34px] flex items-center justify-center relative p-0" type="button"><img class="h-[24px] w-[24px] invert opacity-80" src="/assets/justify.svg" alt=""></button>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <label>Font Size</label>
                                <div class="flex items-center gap-2">
                                    <input id="textSizeInput" type="number" min="1" value="16">
                                    <label class="hidden">Font Unit</label>
                                    <select id="textSizeUnitInput">
                                        <option value="px">px</option>
                                        <option value="vw">vw</option>
                                    </select>
                                </div>
                                <label>Min Font Size (px)</label>
                                <input id="textMinSizeInput" type="number" min="1" value="12">
                                <label>Text Color</label>
                                <input id="textColorInput" type="color" value="#0f172a" class="h-8 !p-1">
                                <label>Line Height (%)</label>
                                <input id="textLineHeightInput" type="number" min="50" value="120">
                                <label>Paragraph Spacing (%)</label>
                                <input id="textParagraphSpacingInput" type="number" min="0" value="0">
                            </div>
                        </div>

                        <div class="crud-actions">
                            <button id="deleteElementBtn" class="cta danger" type="button">Delete Selected</button>
                            <button id="saveCanvasBtn" class="cta" type="button">Save Changes</button>
                        </div>
                    </div>
                </div>
                <div id="layersPanel">
                    layers
                </div>
            </div>
        </aside>
        <section>
            <div class="canvas" id="adminCanvas"></div>
        </section>
    </main>
</body>

</html>
