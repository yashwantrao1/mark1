<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Page Builder</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="builder-layout">
        <section class="controls-panel">
            <div id="panelTabs" class="panel-tabs">
                <button id="builderTabBtn" class="tab-btn active" type="button">CMS Page Builder</button>
                <button id="layersTabBtn" class="tab-btn" type="button">Layers</button>
                <button id="editorTabBtn" class="tab-btn hidden" type="button">Editor</button>
            </div>

            <section id="builderPanel" class="tab-panel active">
                <div class="control-group">
                    <label for="contentSelect">Content Listing</label>
                    <select id="contentSelect">
                        <option value="">Select content</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="canvasHeightSelect">Canvas Height</label>
                    <select id="canvasHeightSelect">
                        <option value="60">60vh</option>
                        <option value="80">80vh</option>
                        <option value="100">100vh</option>
                        <option value="200">200vh</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="textInput">Text</label>
                    <textarea id="textInput" rows="4" placeholder="Enter text content"></textarea>
                </div>

                <div class="actions">
                    <button id="addContentBtn" type="button">Add Selected Content</button>
                    <button id="addTextBtn" type="button">Add Text</button>
                    <button id="connectRootBtn" type="button" class="secondary-btn">Connect customTemplate Folder</button>
                    <button id="saveLayoutBtn" type="button">Save Layout</button>
                    <button id="clearAllBtn" type="button" class="secondary-btn">Clear All</button>
                </div>
                <p id="connectionStatus" class="connection-status">Connection status: Not connected</p>
                <div class="control-group">
                    <label for="layoutFileSelect">Route File (index.html)</label>
                    <select id="layoutFileSelect">
                        <option value="">Connect folder and select route file</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="parentFolderSelect">Existing Folders</label>
                    <select id="parentFolderSelect">
                        <option value="">Connect folder to load existing folders</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="newFolderNameInput">New Folder Name</label>
                    <input id="newFolderNameInput" type="text" placeholder="example: newPath">
                </div>
                <div class="actions">
                    <button id="createFolderBtn" type="button" class="secondary-btn">Create Folder Inside Selected</button>
                    <button id="createIndexBtn" type="button" class="secondary-btn">Create index.html in Selected Folder</button>
                </div>
                
            </section>

            <section id="layersPanel" class="tab-panel">
                <p class="group-title">Layers</p>
                <div id="layersList" class="layers-list"></div>
            </section>

            <section id="editorPanel" class="tab-panel">
                <button id="closeEditorBtn" type="button" class="secondary-btn">← Back & Deselect</button>
                <section id="textEditorControls" class="control-group hidden">
                    <p class="group-title">Text Controls</p>
                    <label class="option-check"><input id="textMovableToggle" type="checkbox"><span>Can move/resize</span></label>
                    <label for="fontSizeInput">Font Size (vw)</label>
                    <input id="fontSizeInput" type="number" min="0.5" max="20" step="0.1" value="2.4">
                    <label for="fontWeightSelect">Font Weight</label>
                    <select id="fontWeightSelect">
                        <option value="400">Normal</option>
                        <option value="500">Medium</option>
                        <option value="600">Semi Bold</option>
                        <option value="700">Bold</option>
                        <option value="800">Extra Bold</option>
                    </select>
                    <div class="align-icons">
                        <button id="alignLeftBtn" type="button" class="secondary-btn">⯇</button>
                        <button id="alignCenterBtn" type="button" class="secondary-btn">≡</button>
                        <button id="alignRightBtn" type="button" class="secondary-btn">⯈</button>
                        <button id="alignJustifyBtn" type="button" class="secondary-btn">☰</button>
                    </div>
                    <div class="mini-actions">
                        <label class="option-check"><input id="boldToggle" type="checkbox"><span>Bold</span></label>
                        <label class="option-check"><input id="italicToggle" type="checkbox"><span>Italic</span></label>
                    </div>
                    <button id="updateSelectedBtn" type="button" class="secondary-btn">Apply Text</button>
                </section>

                <section id="imageControls" class="control-group hidden">
                    <p class="group-title">Image Controls</p>
                    <label class="option-check"><input id="imageMovableToggle" type="checkbox"><span>Can move/resize</span></label>
                    <label for="imageScaleRange">Scale</label>
                    <input id="imageScaleRange" type="range" min="1" max="3" step="0.05" value="1">
                    <label for="objectFitSelect">Object Fit</label>
                    <select id="objectFitSelect">
                        <option value="cover">Cover</option>
                        <option value="contain">Contain</option>
                        <option value="fill">Fill</option>
                        <option value="none">None</option>
                    </select>
                    <label class="option-check"><input id="objectPositionDragToggle" type="checkbox"><span>Enable object position drag</span></label>
                    <button id="deleteSelectedBtn" type="button" class="secondary-btn">Delete Selected</button>
                </section>
            </section>
        </section>

        <section class="canvas-wrapper">
            <section id="createHome" class="preview-area" aria-live="polite"></section>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
